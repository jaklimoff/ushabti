services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ushabti
      POSTGRES_PASSWORD: ushabti
      POSTGRES_DB: ushabti
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ushabti -d ushabti"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "npm install && npm run db:push -- --force && npm run dev"
    environment:
      DATABASE_URL: postgres://ushabti:ushabti@db:5432/ushabti
      NODE_ENV: development
      # A webhook may be pointed at a private address here, because a
      # developer's receiver is on their own machine. docker-compose.prod.yml
      # deliberately does not set this: on a server it would make a webhook a
      # way to reach whatever else is on that network.
      USHABTI_WEBHOOK_PRIVATE: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Files go to the minio service below. A signed URL names the host it
      # was signed for, so the server and the browser must reach MinIO at
      # the same address: minio shares this container's network, and
      # localhost:9050 means MinIO both in here and on the host.
      S3_ENDPOINT: http://localhost:9050
      S3_REGION: us-east-1
      S3_BUCKET: ushabti
      S3_ACCESS_KEY: ushabti
      S3_SECRET_KEY: ushabti-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      # 3000 is a busy port on a development machine. The dev server keeps
      # 3050 for itself; the shipped image still listens on 3000.
      - "3050:3050"
      # MinIO, which listens inside this container's network.
      - "127.0.0.1:9050:9050"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - next-cache:/workspace/.next
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address :9050 --console-address :9051
    network_mode: "service:app"
    environment:
      MINIO_ROOT_USER: ushabti
      MINIO_ROOT_PASSWORD: ushabti-secret
    volumes:
      - minio-data:/data

  # Makes the bucket once MinIO answers, then stops. It never makes the
  # bucket public: a file is read only through the board.
  minio-bucket:
    image: minio/mc:latest
    network_mode: "service:app"
    entrypoint: >
      sh -c "until mc alias set local http://localhost:9050 ushabti ushabti-secret >/dev/null 2>&1;
             do sleep 1; done; mc mb --ignore-existing local/ushabti"
    depends_on:
      - minio

volumes:
  db-data:
  minio-data:
  node-modules:
  next-cache:
