services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ushabti
      POSTGRES_PASSWORD: ushabti
      POSTGRES_DB: ushabti
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ushabti -d ushabti"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "npm install && npm run db:push -- --force && npm run dev"
    environment:
      DATABASE_URL: postgres://ushabti:ushabti@db:5432/ushabti
      NODE_ENV: development
      # A webhook may be pointed at a private address here, because a
      # developer's receiver is on their own machine. docker-compose.prod.yml
      # deliberately does not set this: on a server it would make a webhook a
      # way to reach whatever else is on that network.
      USHABTI_WEBHOOK_PRIVATE: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Files go to the rustfs service below. A signed URL names the host it
      # was signed for, so the server and the browser must reach RustFS at
      # the same address: rustfs shares this container's network, and
      # localhost:9050 means RustFS both in here and on the host.
      S3_ENDPOINT: http://localhost:9050
      S3_REGION: us-east-1
      S3_BUCKET: ushabti
      S3_ACCESS_KEY: ushabti
      S3_SECRET_KEY: ushabti-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      # 3000 is a busy port on a development machine. The dev server keeps
      # 3050 for itself; the shipped image still listens on 3000.
      - "3050:3050"
      # RustFS, which listens inside this container's network.
      - "127.0.0.1:9050:9050"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - next-cache:/workspace/.next
    depends_on:
      db:
        condition: service_healthy

  # The bucket is made by the app as it starts, so no helper runs here. It is
  # never public: a file is read only through the board.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    network_mode: "service:app"
    environment:
      RUSTFS_ADDRESS: ":9050"
      RUSTFS_CONSOLE_ADDRESS: ":9051"
      RUSTFS_ACCESS_KEY: ushabti
      RUSTFS_SECRET_KEY: ushabti-secret
      # The browser PUTs a file straight to the store. MinIO allowed every
      # origin by itself; RustFS answers a preflight only for these.
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3050
      # Logs go to `docker compose logs`, not to a folder in the container.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs-data:/data

volumes:
  db-data:
  rustfs-data:
  node-modules:
  next-cache:
