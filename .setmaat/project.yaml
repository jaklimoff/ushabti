# The config of Setmaat for this project.
# Each program is programs.<name>: { use, with, agents, critical }; a role under
# a program is owned by it (Setmaat decisions SET-443 and SET-444).
name: ushabti
board:
  kind: ushabti
  url_env: USHABTI_URL
  project: USH
  token_env: USHABTI_TOKEN
  map:
    stage:
      {
        backlog: Backlog,
        ready: Todo,
        in_progress: In Progress,
        review: In review,
        done: Ready,
        released: Shipped,
      }
    priority: Priority
    refined: Refined
    size: Estimate
# The roles of the person.
agents:
  po-chat:
    mode: interactive
    setup: person
    model: claude-opus-5-5
    about: The person's own product owner session, with the person's setup
    page: docs/product-owner.md
programs:
  loop:
    use: setmaat:loop
    critical: true
    with:
      # The fast checks, then the @smoke tests and the specs the task changed,
      # on a throwaway server of the task's own build (.setmaat/e2e.sh), at low
      # priority (.setmaat/check.sh, the owner, 2026-10-08). The whole suite runs once a batch, before the push (.setmaat/e2e.sh).
      check: sh .setmaat/check.sh
      # Lands on the local main and pushes nothing: the owner pushes once the batch
      # is done, after .setmaat/e2e.sh, so CI runs once and not once a task
      # (the owner, 2026-10-08). The admin role passes the main ruleset.
      land: { mode: fast-forward, push: false, squash: true }
      brief: .setmaat/brief.md
      # The reviewer sees the screens the task changed: the screenshots of the
      # specs it changed, from the check's Playwright run (USH-308).
      review:
        shots: sh .setmaat/shots.sh
      # Each task is built in its own worktree, so the main checkout stays on main.
      # node_modules is an APFS clone of the main checkout's: nearly free.
      setup: cp -Rc "$SETMAAT_ROOT/node_modules" node_modules
    agents:
      builder:
        model: claude-opus-5-5
        tools: [Bash, Edit, Write, NotebookEdit, WebFetch, WebSearch]
        sees: [setmaat] # to ask the Setmaat PO for a change (USH-399)
      reviewer:
        model: claude-opus-5-5
        tools: [Read, Grep, Glob, "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)"]
  # A release ships what is in Ready: the check, the tag, the push, the deploy,
  # then the tasks move to Shipped (docs/RELEASE-PROGRAM.md in Setmaat, USH-311).
  release:
    use: setmaat:release
    with:
      # Only a press of Release: the owner decides when, so no cron, and no role,
      # because every task was reviewed before it landed.
      button: true
      # Until 1.0.0 a minor bump may break something (CONTRIBUTING.md).
      bump: minor
      # The whole suite the CI way, as before the push after a batch: the loop
      # lands on main and pushes nothing, so this push is the one CI sees.
      check: sh .setmaat/e2e.sh
      # A new migration cannot be undone by a rollback, so its SQL waits for a yes.
      confirm: sh .setmaat/release/migrations.sh
      # A release that waits for a yes is busy, and a busy program holds back the
      # restart of `up` after a Setmaat release (SET-346). An hour, not the 24 h
      # default, so that restart does not wait a day.
      confirm_timeout: 1h
      # The changelog heading and package.json must match the tag (release.yml).
      tag: sh .setmaat/release/tag.sh
      # No build: docker.yml builds the image on the tag. The deploy waits for it.
      deploy: sh .setmaat/release/deploy.sh
      # Last, after the tasks move to Shipped: the board's Ship archives only what
      # is over, and at the deploy the tasks were still in Ready. It ships the
      # release on the board, which writes its changelog entry. A failure here
      # undoes nothing: the tag, the deploy and the move already happened.
      after: sh .setmaat/release/ship.sh
      # For each command: the whole suite is long, and the deploy waits up to 45 min.
      timeout: 90m
  # The PO desk: it writes the board for its role po, which calls it with
  # `setmaat po` (SET-436). It files an unrefined backlog task with the prefix
  # [po], or comments on a task.
  po-desk:
    use: setmaat:po-desk
    with:
      tasks_per_day: 5
      # The token is the agent user "Product Owner", in .envrc. The runner drops it
      # from every agent turn (SET-413).
      token_env: USHABTI_PO_TOKEN
    agents:
      # The PO of Ushabti answers the requests to ushabti/po (docs/PO.md in
      # Setmaat, SET-436): agents of other projects ask for a change, and the
      # builders ask it to file or comment on a task. It reads the code, and it
      # changes the board only with `setmaat po`, through the program po-desk.
      # It has no board token. .setmaat/po.md has the rules of the tool and sends
      # it to docs/product-owner.md, the owner's page, kept out of git.
      po:
        public: true
        mode: headless
        autostart: true
        max: 1
        idle_stop: 30m
        model: claude-opus-5-5
        tools: [Read, Grep, Glob]
        page: .setmaat/po.md
  # The state of the GitHub Actions, for the custom page CI of Setmaat
  # (decisions SET-489 and SET-495). It runs gh in the checkout of up.
  ci:
    use: setmaat:ci
    with:
      every: 5m
