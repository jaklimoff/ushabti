name: Release

# A tag makes the release. `git tag -a v0.2.0 -m ... && git push origin v0.2.0`
# publishes the image (see docker.yml) and creates the GitHub release from the
# matching section of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: The tag, package.json and the changelog must agree
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag <date>' heading"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Take this version out of the changelog
        run: |
          awk -v v="${{ steps.check.outputs.version }}" '
            $0 ~ "^## " v " "   { on = 1; next }
            on && /^## /        { exit }
            on                  { print }
          ' CHANGELOG.md > NOTES.md
          echo "" >> NOTES.md
          echo "**Image**: \`docker pull jaklimoff/ushabti:${{ steps.check.outputs.version }}\`" >> NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            --verify-tag
