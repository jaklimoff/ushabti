name: CI

# The pull request run is the gate. The `main` run stays because a squash
# merge makes a commit that no run has seen before; it is the only cheap check
# that the squashed tree still builds. Both runs have the same jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Everything that is not a browser, once. The shards wait for it, so a tree
  # that fails a check never starts the end to end tests. The build needs no
  # database: `src/db/url.ts` lets `next build` load with none.
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # `src/lib/__tests__/ci.test.ts` is here too. It fails, with both version
      # numbers, when the image tag below differs from `@playwright/test`.
      - name: Unit tests
        run: npm test

      # Playwright serves this build to the end to end tests, so they exercise
      # what the image ships.
      - name: Production build
        run: npm run build

      # Built once and handed on. The standalone server runs from any folder,
      # and the shards see this workspace under another path. A tar, because
      # the upload leaves out a hidden folder such as `.next`.
      - name: Pack the build
        run: tar -cf build.tar .next/standalone .next/static

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tar
          retention-days: 1

  # The specs share one database and were written to run one after another,
  # so `workers: 1` stays inside a shard. Three shards each get their own
  # Postgres and their own server, and no shard sees another's data.
  e2e:
    needs: gate
    runs-on: ubuntu-latest

    # The image carries the browser and every library it links against, so
    # there is no apt step: the Ubuntu mirror once held a run for 9 minutes.
    # The tag must be the installed `@playwright/test`, or the browser is not
    # the one it looks for. The gate's unit tests check that.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    strategy:
      # A shard that fails leaves the others running, so one run shows every
      # failure and not only the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Inside a container a service is reached by its name, not a mapped port.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ushabti
          POSTGRES_PASSWORD: ushabti
          POSTGRES_DB: ushabti
        options: >-
          --health-cmd "pg_isready -U ushabti -d ushabti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ushabti:ushabti@postgres:5432/ushabti

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unpack the build
        run: tar -xf build.tar

      - name: Database schema
        run: npm run db:migrate

      - name: End to end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The `main` ruleset requires one check named `test`. This is it, so the
  # ruleset did not change when the work split into jobs. `always()` makes it
  # run after a failure too; anything but success from every job fails it,
  # which counts a cancelled or skipped shard as a failure.
  test:
    needs: [gate, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Every job passed
        run: |
          if [ "${{ needs.gate.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]; then
            exit 0
          fi
          echo "The gate ended ${{ needs.gate.result }} and the end to end shards ended ${{ needs.e2e.result }}."
          exit 1
