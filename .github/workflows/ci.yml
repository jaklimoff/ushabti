name: CI

# The pull request run is the gate. The `main` run stays because a squash
# merge makes a commit that no run has seen before; it is the only cheap check
# that the squashed tree still builds. Both runs have the same jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Everything that is not a browser, once. The shards wait for it, so a tree
  # that fails a check never starts the end to end tests. The build needs no
  # database: `src/db/url.ts` lets `next build` load with none.
  gate:
    runs-on: ubuntu-latest

    steps:
      # The whole history: the GitHub step's tests read the board.mjs that
      # `examples/github/ushabti-links.yml` pins with `git show`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # `src/lib/__tests__/ci.test.ts` is here too. It fails, with both version
      # numbers, when the image tag below differs from `@playwright/test`.
      - name: Unit tests
        run: npm test

      # Playwright serves this build to the end to end tests, so they exercise
      # what the image ships.
      - name: Production build
        run: npm run build

      # Built once and handed on. The standalone server runs from any folder,
      # and the shards see this workspace under another path. A tar, because
      # the upload leaves out a hidden folder such as `.next`.
      - name: Pack the build
        run: tar -cf build.tar .next/standalone .next/static

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tar
          retention-days: 1

  # A spec makes its own people and projects, so files run side by side: two
  # workers in each of three shards, a runner having four cores to share with
  # the server and Postgres. A file still runs in order, and the mail specs,
  # which share one SMTP port, run one at a time in a project of their own.
  # Each shard gets its own Postgres and its own server.
  e2e:
    needs: gate
    runs-on: ubuntu-latest

    # The image carries the browser and every library it links against, so
    # there is no apt step: the Ubuntu mirror once held a run for 9 minutes.
    # The tag must be the installed `@playwright/test`, or the browser is not
    # the one it looks for. The gate's unit tests check that.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    strategy:
      # A shard that fails leaves the others running, so one run shows every
      # failure and not only the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Inside a container a service is reached by its name, not a mapped port.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ushabti
          POSTGRES_PASSWORD: ushabti
          POSTGRES_DB: ushabti
        options: >-
          --health-cmd "pg_isready -U ushabti -d ushabti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # The object store a task's files go to. The server makes the bucket as
      # it starts, and `e2e/attachments.spec.ts` puts a real PNG in it. The
      # server and the browser both live in this container, so both reach
      # the store by its name, which is the host a signed URL names. It has no
      # health check on purpose: a store that never answers skips the upload
      # spec with a sentence, where a failed check would stop every shard.
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ushabti
          RUSTFS_SECRET_KEY: ushabti-secret
          # The browser PUTs a file straight to the store, and RustFS answers
          # a preflight only for these origins. Node sends no preflight, so
          # without it only the specs that upload from a page fail.
          RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
          RUSTFS_OBS_LOG_DIRECTORY: ""

    env:
      DATABASE_URL: postgres://ushabti:ushabti@postgres:5432/ushabti
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ushabti
      S3_ACCESS_KEY: ushabti
      S3_SECRET_KEY: ushabti-secret
      S3_FORCE_PATH_STYLE: "true"

    steps:
      # The whole history: the GitHub step's tests read the board.mjs that
      # `examples/github/ushabti-links.yml` pins with `git show`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unpack the build
        run: tar -xf build.tar

      - name: Database schema
        run: npm run db:migrate

      - name: End to end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --workers=2

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The `main` ruleset requires one check named `test`. This is it, so the
  # ruleset did not change when the work split into jobs. `always()` makes it
  # run after a failure too; anything but success from every job fails it,
  # which counts a cancelled or skipped shard as a failure.
  test:
    needs: [gate, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Every job passed
        run: |
          if [ "${{ needs.gate.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]; then
            exit 0
          fi
          echo "The gate ended ${{ needs.gate.result }} and the end to end shards ended ${{ needs.e2e.result }}."
          exit 1
