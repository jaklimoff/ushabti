name: CI

# The pull request run is the gate. The `main` run stays because a squash
# merge makes a commit that no run has seen before; it is the only cheap check
# that the squashed tree still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ushabti
          POSTGRES_PASSWORD: ushabti
          POSTGRES_DB: ushabti
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U ushabti -d ushabti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ushabti:ushabti@localhost:5435/ushabti
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Playwright serves this build to the end to end tests, so they exercise
      # what the image ships.
      - name: Production build
        run: npm run build

      - name: Database schema
        run: npm run db:migrate

      # The browser is 130 MB and never changes between runs of one Playwright
      # version, so downloading it every time was 26 seconds of pure waste.
      # The key holds that version, and a new version misses and downloads once.
      - name: Which Playwright is this?
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Look for the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser but not the system libraries it links
      # against, and those live outside ~/.cache. This adds them and nothing
      # else, so a hit still saves the download.
      - name: Install what the browser links against
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End to end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
