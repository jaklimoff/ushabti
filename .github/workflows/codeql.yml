name: CodeQL

# `main` is the gate, not the pull request. The scan takes about seventy
# seconds and it has never held a change back, so making every pull request
# wait for it bought nothing. It now runs on what reaches `main`, which is the
# code the alerts are about, and weekly on top of that, because a new query
# release can find a fault in code that did not change.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
