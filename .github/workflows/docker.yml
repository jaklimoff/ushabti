name: Docker image

# Builds the production image and pushes it to Docker Hub and to the GitHub
# container registry. The two hold the same image.
# A tag like v0.2.0 becomes :0.2.0, :0.2, :0 and :latest. The nightly run of
# `main` becomes :edge.
#
# Each architecture builds on a runner of its own architecture and pushes an
# image with no tag, named only by its digest. A last job then binds the two
# digests into one multi-architecture tag. The older shape built arm64 under
# QEMU on an amd64 runner, which took nine minutes; the emulator was all of it.
#
# A merge into `main` does NOT build an image. The commits it carries already
# passed as a pull request, and an image per merge has no reader. The nightly
# run gives the same :edge tag.
on:
  push:
    tags: ["v*.*.*"]
  # A pull request only rebuilds when something the image depends on moved.
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - next.config.mjs
      - scripts/**
      - .github/workflows/docker.yml
  schedule:
    # 03:41 UTC. An odd minute keeps the job off the top of the hour, where
    # the GitHub scheduler is busiest and starts late.
    - cron: "41 3 * * *"
  workflow_dispatch:

# A newer commit on a branch replaces the build of the older one. A run that
# publishes is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: docker.io/jaklimoff/ushabti
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The nightly run stops here if nobody pushed to `main` since the last one.
  # An idle repository then costs nothing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      - name: Did main move in the last day?
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='25 hours ago' --format=%H)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main did not move; the nightly image stays as it is" >> "$GITHUB_STEP_SUMMARY"
          fi

  # One job per architecture, each on a runner of that architecture. A pull
  # request builds amd64 only, because nothing reads the arm64 half of a
  # pull request and the check is the same.
  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"}]'
          || '[{"platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]') }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # No setup-qemu-action. Nothing is emulated any more.
      - uses: docker/setup-buildx-action@v4

      # A pull request is built but never pushed. Nothing outside the
      # repository can publish an image.
      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to the GitHub registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.title=Ushabti
            org.opencontainers.image.description=A small task board where every field is a property you define
            org.opencontainers.image.licenses=MIT

      # `mode=min` on purpose. `mode=max` wrote every layer of every build
      # stage for every architecture on every build, which filled the whole
      # 10 GB repository cache in a day and then evicted itself. `min` writes
      # only the layers of the final image. The scope keeps the two
      # architectures from overwriting each other's entry.
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.slug }}
          cache-to: type=gha,mode=min,scope=image-${{ matrix.slug }}
          # A pull request only has to prove the image builds.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.GHCR_IMAGE) }}

      # The merge job needs the digest and nothing else. A file named after
      # the digest is enough, and two jobs writing into one artifact never
      # collide that way.
      - name: Hand the digest on
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Binds the per-architecture digests into one tag list, on both registries.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to the GitHub registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # :edge only comes from the default branch, so a tag build cannot
          # move it and a pull request cannot claim it. The action reads the
          # default branch itself; do not compare ref names by hand.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      # The digests were pushed to GHCR only. `imagetools create` copies the
      # layers it needs, so the same call also fills Docker Hub.
      - name: Make the multi-architecture tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Read the digest of the tag
        id: digest
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "value=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Proof of where the image came from, readable with `gh attestation verify`.
      - name: Attest the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      # Keeps the Docker Hub page showing the README of this repository.
      # One API call, and the page never goes stale.
      - name: Copy the README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jaklimoff/ushabti
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
