name: Docker image

# Builds the production image and pushes it to Docker Hub and to the GitHub
# container registry. The two hold the same image.
# A tag like v0.2.0 becomes :0.2.0, :0.2, :0 and :latest. The nightly run of
# `main` becomes :edge.
#
# A merge into `main` does NOT build an image. The commits it carries already
# passed as a pull request, and an image per merge has no reader. The nightly
# run gives the same :edge tag for a fraction of the runner time, because the
# arm64 half of the build is emulated and slow.
on:
  push:
    tags: ["v*.*.*"]
  # A pull request only rebuilds when something the image depends on moved.
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - next.config.mjs
      - scripts/**
      - .github/workflows/docker.yml
  schedule:
    # 03:41 UTC. An odd minute keeps the job off the top of the hour, where
    # the GitHub scheduler is busiest and starts late.
    - cron: "41 3 * * *"
  workflow_dispatch:

# A newer commit on a branch replaces the build of the older one. A run that
# publishes is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: docker.io/jaklimoff/ushabti
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The nightly run stops here if nobody pushed to `main` since the last one.
  # An idle repository then costs nothing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      - name: Did main move in the last day?
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='25 hours ago' --format=%H)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main did not move; the nightly image stays as it is" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # A pull request is built but never pushed. Nothing outside the
      # repository can publish an image.
      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to the GitHub registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # :edge only comes from the default branch, so a tag build cannot
          # move it and a pull request cannot claim it. The action reads the
          # default branch itself; do not compare ref names by hand.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Ushabti
            org.opencontainers.image.description=A small task board where every field is a property you define
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # arm64 is emulated and slow, so a pull request checks amd64 only.
          # A tag and the nightly build both architectures.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proof of where the image came from, readable with `gh attestation verify`.
      - name: Attest the image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Keeps the Docker Hub page showing the README of this repository.
      # Runs whenever an image was pushed, which is every event except a
      # pull request. One API call, and the page never goes stale.
      - name: Copy the README to Docker Hub
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jaklimoff/ushabti
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
