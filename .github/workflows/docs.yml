name: Docs

# The documentation site. It is built from website/ and from the four markdown
# files at the root that scripts/sync.mjs copies in, so a change to CHANGELOG.md
# publishes as well.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - name: Types
        run: npm run check
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist

  # Only main deploys. A pull request builds, which is the check that matters.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
